; Alembic configuration for the image model lab schema.
;
; It lives inside the package so a built service image carries its own
; migrations: the image that runs the code is the image that can bring the
; database up to the revision that code expects.
;
;     just migrate upgrade head
;     just migrate downgrade base
;
; There is deliberately no `sqlalchemy.url` here. The URL carries a password
; and differs per deployment, so `env.py` reads it from the environment
; variable every service reads.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

; Revision ids are sequential and zero-padded rather than random hex, so
; `versions/` reads in the order the revisions were written.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
