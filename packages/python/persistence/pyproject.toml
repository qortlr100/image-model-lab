[project]
name = "image-model-lab-persistence"
version = "0.1.0"
description = "PostgreSQL mapping, repositories and migrations for the image model lab."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16.5,<2",
  "image-model-lab-application",
  "image-model-lab-domain",
  "psycopg[binary]>=3.2.10,<4",
  "sqlalchemy>=2.0.44,<3",
]

[tool.uv.sources]
image-model-lab-application = { workspace = true }
image-model-lab-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
