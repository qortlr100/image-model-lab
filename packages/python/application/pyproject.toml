[project]
name = "image-model-lab-application"
version = "0.1.0"
description = "Use case ports for the image model lab. Infrastructure depends inward on this package."
requires-python = ">=3.13,<3.14"
dependencies = ["image-model-lab-domain"]

[tool.uv.sources]
image-model-lab-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
