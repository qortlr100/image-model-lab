[project]
name = "image-model-lab-api"
version = "0.1.0"
description = "HTTP API service skeleton for the image model lab."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.1,<1",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
image-model-lab-api = "image_model_lab_api.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
