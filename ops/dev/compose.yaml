# Local development dependencies. Not a deployment.
#
# This file starts the one thing a developer cannot run the persistence tests
# without. Real hosts, volumes, secrets, reverse proxy and restart policy live
# in `qortlr100/homeserver`; nothing here should grow into them.
#
#     docker compose -f ops/dev/compose.yaml up -d
#     export IMAGE_MODEL_LAB_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
#     just test
#
# The credentials below are the defaults of a container bound to localhost,
# published so the tests need no setup. A deployment injects its own.

name: image-model-lab-dev

services:
  postgres:
    # Pinned to the major the schema and its migrations are tested against.
    # Which major the homeserver runs is that repository's decision; the
    # schema uses no feature specific to a version above this one.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_model_lab
    ports:
      # Bound to the loopback interface, not to every address on the machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
