[project]
name = "image-model-lab"
version = "0.0.0"
description = "Workspace root for the image model lab."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=8.4.2,<9",
  "ruff>=0.14.0,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python/*", "services/*"]

[tool.pyright]
include = ["packages/python", "services"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/python", "services"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
